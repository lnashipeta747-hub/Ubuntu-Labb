<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNam | Marketplace</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        header { background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 4px solid #3b82f6; margin-bottom: 30px; }
        .status-bar { display: inline-flex; align-items: center; background: #000; padding: 5px 15px; border-radius: 20px; font-size: 0.8em; margin-top: 10px; }
        .dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px #22c55e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 15px; overflow: hidden; transition: 0.3s; border: 1px solid #334155; }
        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; }
        .price { color: #3b82f6; font-weight: bold; font-size: 1.2em; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        button:hover { background: #2563eb; }
        /* Simple Modal Styling */
        #detailsModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 30px; border-radius: 15px; border: 2px solid #3b82f6; z-index: 100; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 99; }
    </style>
</head>
<body>

<header>
    <h1>AUTONAM <span style="color:#3b82f6">MARKET</span></h1>
    <div class="status-bar"><div class="dot"></div> SERVER ACTIVE | UPTIME: <span id="timer">0</span>s</div>
</header>

<div class="grid">
    <div class="card">
        <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=500" alt="SUV">
        <div class="card-content">
            <h3>Toyota Hilux GD-6</h3>
            <p>Front Bumper Assembly</p>
            <p class="price">N$ 4,500</p>
            <button onclick="showDetails('Toyota Hilux GD-6', 'High-quality replacement bumper. Grade A condition. Available in Windhoek.')">View Details</button>
        </div>
    </div>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1542282088-fe8426682b8f?auto=format&fit=crop&w=500" alt="Sedan">
        <div class="card-content">
            <h3>Volkswagen Golf 7</h3>
            <p>LED Headlight Set</p>
            <p class="price">N$ 3,200</p>
            <button onclick="showDetails('Volkswagen Golf 7', 'Genuine LED units. Pair (Left & Right). Tested and working.')">View Details</button>
        </div>
    </div>
</div>

<div id="overlay" onclick="closeDetails()"></div>
<div id="detailsModal">
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <button onclick="closeDetails()">Close</button>
</div>

<script>
    let seconds = 0;
    setInterval(() => { seconds++; document.getElementById('timer').innerText = seconds; }, 1000);

    function showDetails(title, info) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = info;
        document.getElementById('detailsModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function closeDetails() {
        document.getElementById('detailsModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }
</script>
</body>
</html>
