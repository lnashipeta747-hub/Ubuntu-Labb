<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoNam | Namibian Parts Marketplace</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        header { background: #1e293b; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 4px solid #3b82f6; margin-bottom: 30px; }
        .status-bar { display: inline-flex; align-items: center; background: #000; padding: 5px 15px; border-radius: 20px; font-size: 0.8em; margin-top: 10px; }
        .dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px #22c55e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 15px; overflow: hidden; transition: 0.3s; border: 1px solid #334155; }
        .card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; }
        .price { color: #3b82f6; font-weight: bold; font-size: 1.2em; }
        .timer-box { font-family: monospace; color: #94a3b8; margin-top: 5px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>AUTONAM <span style="color:#3b82f6">MARKET</span></h1>
    <div class="status-bar"><div class="dot"></div> SERVER ACTIVE | UPTIME: <span id="timer">0</span>s</div>
</header>

<div class="grid">
    <div class="card">
        <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=500&q=60" alt="SUV">
        <div class="card-content">
            <h3>Toyota Hilux GD-6</h3>
            <p>Front Bumper Assembly</p>
            <p class="price">N$ 4,500</p>
            <button>View Details</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1542282088-fe8426682b8f?auto=format&fit=crop&w=500&q=60" alt="Sedan">
        <div class="card-content">
            <h3>Volkswagen Golf 7</h3>
            <p>LED Headlight Set</p>
            <p class="price">N$ 3,200</p>
            <button>View Details</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=500&q=60" alt="Sports Car">
        <div class="card-content">
            <h3>Porsche 911 Style</h3>
            <p>Performance Brake Pads</p>
            <p class="price">N$ 1,850</p>
            <button>View Details</button>
        </div>
    </div>
</div>

<script>
    // Timer Logic
    let seconds = 0;
    setInterval(() => {
        seconds++;
        document.getElementById('timer').innerText = seconds;
    }, 1000);

    // Auto-Refresh Logic: If the page fails to fetch itself, it waits and reloads when Nginx is back.
    function heartbeat() {
        fetch(window.location.href, { mode: 'no-cors' })
            .then(() => console.log("Connection stable"))
            .catch(() => {
                console.log("Server down... attempting auto-recovery...");
                setTimeout(() => window.location.reload(), 5000);
            });
    }
    setInterval(heartbeat, 10000);
</script>

</body>
</html>
